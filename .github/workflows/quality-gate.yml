name: ORBI Clima Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript gate
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 7

      - name: Stop on TypeScript failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Mobile Home Experience source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run ui:verify-mobile-home

      - name: Premium Home Atmosphere source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run ui:verify-premium-home

      - name: Current Weather Truth source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run weather:verify-current-truth

      - name: Android background-watch source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run android:verify-background-watch

      - name: Android performance source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run android:verify-performance

      - name: Android 16 target and permission source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run android:verify-modern-target

      - name: Android runtime readiness source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run android:verify-runtime-readiness

      - name: Premium 4x4 snapshot source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run android:verify-premium-widget

      - name: Immediate multi-widget refresh source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run android:verify-widget-refresh

      - name: Production build
        if: steps.typecheck.outcome == 'success'
        run: npm run build

  android-native-build:
    needs: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORBI_ANDROID_KEYSTORE_B64: ${{ secrets.ORBI_ANDROID_KEYSTORE_B64 }}
      ORBI_KEYSTORE_PASSWORD: ${{ secrets.ORBI_ANDROID_KEYSTORE_PASSWORD }}
      ORBI_KEY_ALIAS: ${{ secrets.ORBI_ANDROID_KEY_ALIAS }}
      ORBI_KEY_PASSWORD: ${{ secrets.ORBI_KEY_PASSWORD }}
      ORBI_KEYSTORE_PATH: ${{ github.workspace }}/android/app/orbi-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install dependencies
        run: npm ci

      - name: Build current web bundle
        run: npm run build

      - name: Copy current web bundle into Android
        run: npx cap copy android

      - name: Verify bundled Zen audio integrity after Capacitor copy
        run: npm run android:verify-audio-assets

      - name: Verify Mobile Home Experience after Capacitor copy
        run: npm run ui:verify-mobile-home

      - name: Verify Premium Home Atmosphere after Capacitor copy
        run: npm run ui:verify-premium-home

      - name: Verify Current Weather Truth after Capacitor copy
        run: npm run weather:verify-current-truth

      - name: Verify background-watch invariants after Capacitor copy
        run: npm run android:verify-background-watch

      - name: Verify Android performance after Capacitor copy
        run: npm run android:verify-performance

      - name: Verify Android 16 target and permissions after Capacitor copy
        run: npm run android:verify-modern-target

      - name: Verify runtime readiness bridge after Capacitor copy
        run: npm run android:verify-runtime-readiness

      - name: Verify premium 4x4 snapshot after Capacitor copy
        run: npm run android:verify-premium-widget

      - name: Verify immediate multi-widget refresh after Capacitor copy
        run: npm run android:verify-widget-refresh

      - name: Restore persistent ORBI signing keystore
        if: ${{ env.ORBI_ANDROID_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          printf '%s' "$ORBI_ANDROID_KEYSTORE_B64" | base64 --decode > "$ORBI_KEYSTORE_PATH"
          chmod 600 "$ORBI_KEYSTORE_PATH"

      - name: Compile CI debug, OC-21 preview and release artifacts
        working-directory: android
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleOc21Preview :app:assembleRelease :app:bundleRelease

      - name: Upload CI-only debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-clima-ci-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload OC-21 side-by-side preview APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-clima-oc21-side-by-side-apk
          path: android/app/build/outputs/apk/oc21Preview/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload stable signed release APK
        if: ${{ env.ORBI_ANDROID_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: orbi-clima-stable-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: orbi-clima-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
