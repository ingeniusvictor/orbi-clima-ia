name: ORBI Clima Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: Production build
        run: npm run build
