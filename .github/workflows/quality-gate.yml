name: ORBI Clima Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript gate
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 7

      - name: Stop on TypeScript failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Android background-watch source gate
        if: steps.typecheck.outcome == 'success'
        run: npm run android:verify-background-watch

      - name: Production build
        if: steps.typecheck.outcome == 'success'
        run: npm run build

  android-native:
    name: android-native-gradle
    needs: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure hosted Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found on ubuntu-latest" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-36|build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Capacitor
        run: npm run build

      - name: Reconstruct full Capacitor Android project
        run: npm run android:prepare-ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Native Gradle APK/AAB gate
        id: native_gradle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./android/gradlew \
            -p android \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug \
            :app:bundleDebug \
            2>&1 | tee android-native-build.log

      - name: Upload native build diagnostics
        if: steps.native_gradle.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-native-build-diagnostics
          path: android-native-build.log
          retention-days: 7

      - name: Stop on native Gradle failure
        if: steps.native_gradle.outcome == 'failure'
        run: exit 1

      - name: Verify native artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAB="android/app/build/outputs/bundle/debug/app-debug.aab"
          test -s "$APK"
          test -s "$AAB"
          unzip -l "$APK" | tee android-apk-contents.txt
          grep -q "classes.dex" android-apk-contents.txt
          unzip -l "$AAB" | tee android-aab-contents.txt
          grep -q "base/manifest/AndroidManifest.xml" android-aab-contents.txt
          sha256sum "$APK" "$AAB" | tee android-artifact-sha256.txt

      - name: Upload Android APK/AAB evidence
        uses: actions/upload-artifact@v4
        with:
          name: orbi-clima-android-debug-evidence
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
            android-artifact-sha256.txt
            android-apk-contents.txt
            android-aab-contents.txt
            android-native-build.log
          retention-days: 14
          if-no-files-found: error
