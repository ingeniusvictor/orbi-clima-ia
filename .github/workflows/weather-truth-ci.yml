name: Weather Truth CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/weather-truth-core]

permissions:
  contents: read

jobs:
  web-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install clean dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: Production web build
        run: npm run build
