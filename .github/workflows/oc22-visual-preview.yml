name: ORBI Clima OC-22 Visual Preview

on:
  push:
    branches:
      - feature/oc-22-living-weather-atmosphere
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/app/src/**'
      - 'android/app/build.gradle'
      - 'scripts/verify-native-widget-parity.mjs'
      - 'scripts/verify-premium-widget-snapshot.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/oc22-visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORBI_ANDROID_KEYSTORE_B64: ${{ secrets.ORBI_ANDROID_KEYSTORE_B64 }}
      ORBI_KEYSTORE_PASSWORD: ${{ secrets.ORBI_ANDROID_KEYSTORE_PASSWORD }}
      ORBI_KEY_ALIAS: ${{ secrets.ORBI_ANDROID_KEY_ALIAS }}
      ORBI_KEY_PASSWORD: ${{ secrets.ORBI_ANDROID_KEY_PASSWORD }}
      ORBI_KEYSTORE_PATH: ${{ github.workspace }}/android/app/orbi-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: OC-22 atmosphere gate
        run: npm run ui:verify-living-atmosphere

      - name: Weather Truth gate
        run: npm run weather:verify-current-truth

      - name: Native Widget Parity gate
        run: npm run android:verify-widget-parity

      - name: Premium Widget Snapshot gate
        run: npm run android:verify-premium-widget

      - name: Build current web bundle
        run: npm run build

      - name: Copy web bundle into Android preview
        run: npx cap copy android

      - name: Require persistent ORBI preview signing identity
        shell: bash
        run: |
          test -n "$ORBI_ANDROID_KEYSTORE_B64" || { echo "Missing ORBI Android keystore secret"; exit 1; }
          test -n "$ORBI_KEYSTORE_PASSWORD" || { echo "Missing ORBI keystore password"; exit 1; }
          test -n "$ORBI_KEY_ALIAS" || { echo "Missing ORBI key alias"; exit 1; }
          test -n "$ORBI_KEY_PASSWORD" || { echo "Missing ORBI key password"; exit 1; }
          printf '%s' "$ORBI_ANDROID_KEYSTORE_B64" | base64 --decode > "$ORBI_KEYSTORE_PATH"
          chmod 600 "$ORBI_KEYSTORE_PATH"
          test -s "$ORBI_KEYSTORE_PATH"

      - name: Declare preview scope
        shell: bash
        run: |
          echo "VISUAL QA ONLY"
          echo "This side-by-side APK intentionally does not certify the inherited Zen MP3."
          echo "Preview package is persistently signed so future QA APKs can update in place."
          echo "Do not promote this artifact to stable/release."
          grep -n "versionCode 10624" android/app/build.gradle
          grep -n 'versionName "1.0.6-OC22-ADAPTIVE-WIDGETS"' android/app/build.gradle

      - name: Compile persistent-signed side-by-side OC-22 visual preview
        working-directory: android
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleOc21Preview

      - name: Verify preview APK signature
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/oc21Preview -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload 10624 persistent-signed adaptive widget visual QA APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-clima-oc22-adaptive-widgets-persistent-signed-10624
          path: android/app/build/outputs/apk/oc21Preview/*.apk
          if-no-files-found: error
          retention-days: 7
