apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// OC-21 signing policy:
// - Debug builds keep the normal ephemeral Android debug key and are CI-only.
// - Distributable APK/AAB artifacts must use the persistent ORBI release key.
// - The release key itself never lives in the repository; CI injects it through secrets.
def orbiKeystorePath = System.getenv('ORBI_KEYSTORE_PATH')
def orbiKeystorePassword = System.getenv('ORBI_KEYSTORE_PASSWORD')
def orbiKeyAlias = System.getenv('ORBI_KEY_ALIAS')
def orbiKeyPassword = System.getenv('ORBI_KEY_PASSWORD')
def hasOrbiReleaseSigning = orbiKeystorePath &&
        file(orbiKeystorePath).exists() &&
        orbiKeystorePassword &&
        orbiKeyAlias &&
        orbiKeyPassword

android {
    namespace 'com.orbi.clima'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.orbi.clima"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 10603
        versionName "1.0.6-OC21"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasOrbiReleaseSigning) {
                storeFile file(orbiKeystorePath)
                storePassword orbiKeystorePassword
                keyAlias orbiKeyAlias
                keyPassword orbiKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasOrbiReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Jetpack Glance (Android Widgets with Compose DSL)
    implementation "androidx.glance:glance-appwidget:1.1.0"
    implementation "androidx.glance:glance-material3:1.1.0"

    // Android background work: periodic, battery-aware and Doze-compatible.
    // No foreground service and no background-location permission are used.
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Kotlin & Coroutines aligned with Capacitor 8 / Geolocation 8 metadata.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    // Capacitor runtime + generated Cordova compatibility module.
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Generated by `npx cap sync android`; required for @capacitor/geolocation,
// @capacitor/local-notifications and future official Capacitor plugins.
apply from: 'capacitor.build.gradle'
