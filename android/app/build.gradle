apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// OC-21+ signing policy:
// - Debug builds keep the normal ephemeral Android debug key and are CI-only.
// - Distributable release and physical-QA preview artifacts use the persistent ORBI key when available.
// - The release key itself never lives in the repository; CI injects it through secrets.
def orbiKeystorePath = System.getenv('ORBI_KEYSTORE_PATH')
def orbiKeystorePassword = System.getenv('ORBI_KEYSTORE_PASSWORD')
def orbiKeyAlias = System.getenv('ORBI_KEY_ALIAS')
def orbiKeyPassword = System.getenv('ORBI_KEY_PASSWORD')
def hasOrbiReleaseSigning = orbiKeystorePath &&
        file(orbiKeystorePath).exists() &&
        orbiKeystorePassword &&
        orbiKeyAlias &&
        orbiKeyPassword

android {
    namespace 'com.orbi.clima'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.orbi.clima"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 10625
        versionName "1.0.6-OC22-ADAPTIVE-WIDGETS-QA10625"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appLabel: "ORBI Clima IA"]
    }

    signingConfigs {
        release {
            if (hasOrbiReleaseSigning) {
                storeFile file(orbiKeystorePath)
                storePassword orbiKeystorePassword
                keyAlias orbiKeyAlias
                keyPassword orbiKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasOrbiReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        oc21Preview {
            initWith debug
            // Until a persistent QA signing secret is configured, each physical-QA
            // milestone gets a unique applicationId so Android never rejects the APK
            // because a previous GitHub runner used a different ephemeral debug key.
            // This package is intentionally isolated from both stable ORBI Clima IA and
            // earlier OC-22 preview installs.
            applicationIdSuffix ".oc22qa10625"
            versionNameSuffix "-preview"
            debuggable true
            matchingFallbacks = ['debug']
            manifestPlaceholders = [appLabel: "ORBI Clima IA QA 10625"]
            // Once persistent signing is configured, preview builds can return to a
            // stable package and update in place across milestones.
            if (hasOrbiReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation "androidx.glance:glance-appwidget:1.1.0"
    implementation "androidx.glance:glance-material3:1.1.0"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'
