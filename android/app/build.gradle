apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Release signing is intentionally opt-in. CI and clean developer checkouts keep
// producing an unsigned release AAB, while an authorized release workstation can
// provide the upload-key material entirely outside Git through environment vars.
def orbiReleaseSigning = [
    keystorePath : System.getenv('ORBI_RELEASE_KEYSTORE_PATH'),
    storePassword: System.getenv('ORBI_RELEASE_STORE_PASSWORD'),
    keyAlias     : System.getenv('ORBI_RELEASE_KEY_ALIAS'),
    keyPassword  : System.getenv('ORBI_RELEASE_KEY_PASSWORD')
]
def orbiSigningValues = orbiReleaseSigning.values().findAll { value ->
    value != null && !value.trim().isEmpty()
}
def orbiReleaseSigningRequested = !orbiSigningValues.isEmpty()
def orbiReleaseSigningComplete = orbiSigningValues.size() == 4

if (orbiReleaseSigningRequested && !orbiReleaseSigningComplete) {
    throw new GradleException(
        'ORBI release signing is partially configured. Provide all four ORBI_RELEASE_* environment variables or none of them.'
    )
}

def orbiReleaseKeystore = orbiReleaseSigningComplete
    ? rootProject.file(orbiReleaseSigning.keystorePath)
    : null

if (orbiReleaseSigningComplete && !orbiReleaseKeystore.exists()) {
    throw new GradleException(
        "ORBI release keystore was not found at: ${orbiReleaseKeystore}. Keep signing material outside Git and correct ORBI_RELEASE_KEYSTORE_PATH."
    )
}

android {
    namespace 'com.orbi.clima'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.orbi.clima"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        // 1.0.6 build 02. versionCode is monotonic and must never be decreased
        // after an artifact has been uploaded to Google Play.
        versionCode 10602
        versionName "1.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (orbiReleaseSigningComplete) {
                storeFile orbiReleaseKeystore
                storePassword orbiReleaseSigning.storePassword
                keyAlias orbiReleaseSigning.keyAlias
                keyPassword orbiReleaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (orbiReleaseSigningComplete) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Jetpack Glance (Android Widgets with Compose DSL)
    implementation "androidx.glance:glance-appwidget:1.1.0"
    implementation "androidx.glance:glance-material3:1.1.0"

    // Android background work: periodic, battery-aware and Doze-compatible.
    // No foreground service and no background-location permission are used.
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Kotlin & Coroutines aligned with Capacitor 8 / Geolocation 8 metadata.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    // Capacitor runtime + generated Cordova compatibility module.
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Generated by `npx cap sync android`; required for @capacitor/geolocation,
// @capacitor/local-notifications and future official Capacitor plugins.
apply from: 'capacitor.build.gradle'
