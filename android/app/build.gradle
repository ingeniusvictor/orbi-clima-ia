apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Signing policy:
// - Production/release uses the private ORBI signing identity injected through CI secrets.
// - Physical QA uses a separate fixed TEST identity and a fixed QA package so Android
//   can update QA builds in place without ever sharing the production certificate.
// - The QA identity is deliberately non-production and must never sign com.orbi.clima.
def orbiKeystorePath = System.getenv('ORBI_KEYSTORE_PATH')
def orbiKeystorePassword = System.getenv('ORBI_KEYSTORE_PASSWORD')
def orbiKeyAlias = System.getenv('ORBI_KEY_ALIAS')
def orbiKeyPassword = System.getenv('ORBI_KEY_PASSWORD')
def hasOrbiReleaseSigning = orbiKeystorePath &&
        file(orbiKeystorePath).exists() &&
        orbiKeystorePassword &&
        orbiKeyAlias &&
        orbiKeyPassword

def orbiQaKeystorePath = System.getenv('ORBI_QA_KEYSTORE_PATH')
def orbiQaStorePassword = System.getenv('ORBI_QA_STORE_PASSWORD')
def orbiQaKeyAlias = System.getenv('ORBI_QA_KEY_ALIAS')
def orbiQaKeyPassword = System.getenv('ORBI_QA_KEY_PASSWORD')
def hasOrbiQaSigning = orbiQaKeystorePath &&
        file(orbiQaKeystorePath).exists() &&
        orbiQaStorePassword &&
        orbiQaKeyAlias &&
        orbiQaKeyPassword

android {
    namespace 'com.orbi.clima'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.orbi.clima"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 10632
        versionName "1.0.6-OC22-WIDGET-PREVIEW-BRAND-QA10632"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appLabel: "ORBI Clima IA"]
    }

    signingConfigs {
        release {
            if (hasOrbiReleaseSigning) {
                storeFile file(orbiKeystorePath)
                storePassword orbiKeystorePassword
                keyAlias orbiKeyAlias
                keyPassword orbiKeyPassword
            }
        }

        qa {
            if (hasOrbiQaSigning) {
                storeFile file(orbiQaKeystorePath)
                storePassword orbiQaStorePassword
                keyAlias orbiQaKeyAlias
                keyPassword orbiQaKeyPassword
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            if (hasOrbiReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        oc21Preview {
            initWith debug
            // 10628 established the persistent QA update channel.
            // From 10628 onward this suffix stays fixed so versionCode + certificate
            // determine whether Android offers Update.
            applicationIdSuffix ".oc22qa"
            versionNameSuffix "-qa"
            debuggable true
            matchingFallbacks = ['debug']
            manifestPlaceholders = [appLabel: "ORBI Clima IA QA"]
            if (hasOrbiQaSigning) {
                signingConfig signingConfigs.qa
            }
        }
    }

    buildFeatures {
        compose true
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation "androidx.glance:glance-appwidget:1.1.0"
    implementation "androidx.glance:glance-material3:1.1.0"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'
