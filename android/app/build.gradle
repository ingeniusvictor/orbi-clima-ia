apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// OC-21+ signing policy:
// - Debug builds keep the normal ephemeral Android debug key and are CI-only.
// - Distributable APK/AAB artifacts must use the persistent ORBI release key.
// - The release key itself never lives in the repository; CI injects it through secrets.
def orbiKeystorePath = System.getenv('ORBI_KEYSTORE_PATH')
def orbiKeystorePassword = System.getenv('ORBI_KEYSTORE_PASSWORD')
def orbiKeyAlias = System.getenv('ORBI_KEY_ALIAS')
def orbiKeyPassword = System.getenv('ORBI_KEY_PASSWORD')
def hasOrbiReleaseSigning = orbiKeystorePath &&
        file(orbiKeystorePath).exists() &&
        orbiKeystorePassword &&
        orbiKeyAlias &&
        orbiKeyPassword

android {
    namespace 'com.orbi.clima'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.orbi.clima"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 10613
        versionName "1.0.6-OC22-ORB-FLUID"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appLabel: "ORBI Clima IA"]
    }

    signingConfigs {
        release {
            if (hasOrbiReleaseSigning) {
                storeFile file(orbiKeystorePath)
                storePassword orbiKeystorePassword
                keyAlias orbiKeyAlias
                keyPassword orbiKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasOrbiReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // Physical-device validation build. It installs alongside the canonical
        // package when signature migration or isolated visual QA is required.
        oc21Preview {
            initWith debug
            applicationIdSuffix ".oc21preview"
            versionNameSuffix "-preview"
            debuggable true
            matchingFallbacks = ['debug']
            manifestPlaceholders = [appLabel: "ORBI Clima IA OC-22"]
        }
    }

    buildFeatures {
        compose true
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
