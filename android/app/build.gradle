buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Capacitor 8 Geolocation currently publishes Kotlin 2.2 metadata.
        // ORBI must compile with the same Kotlin toolchain or the app module
        // cannot read plugin/runtime metadata.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"

        // Since Kotlin 2.0, Compose Compiler ships with Kotlin and is applied
        // through this dedicated Gradle plugin using the same Kotlin version.
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.2.20"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.orbi.clima'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.orbi.clima"
        minSdk 26
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 10602
        versionName "1.0.6-final-clean"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Capacitor Android template baseline.
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // ORBI native widgets.
    implementation "androidx.glance:glance-appwidget:1.1.0"
    implementation "androidx.glance:glance-material3:1.1.0"

    // OC-11 official SENAPRED background watch.
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Capacitor Geolocation resolves coroutines 1.10.2. Pinning ORBI to the
    // same release avoids an unnecessary downgrade/upgrade conflict.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Generated by `npx cap sync android`; supplies official Capacitor plugins
// such as Geolocation and Local Notifications.
apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, Google Services plugin not applied")
}
