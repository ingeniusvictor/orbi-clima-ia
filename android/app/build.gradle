apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.orbi.clima'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.orbi.clima"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 10718
        versionName "1.0.7-oc18"
        manifestPlaceholders = [appLabel: "ORBI Clima IA"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // QA builds install beside the existing ORBI Clima app instead of
            // attempting to replace a build signed by a different CI debug key.
            applicationIdSuffix ".qa18"
            versionNameSuffix "-qa18"
            manifestPlaceholders = [appLabel: "ORBI Clima IA QA18"]
        }

        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: "ORBI Clima IA"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Jetpack Glance (Android Widgets with Compose DSL)
    implementation "androidx.glance:glance-appwidget:1.1.0"
    implementation "androidx.glance:glance-material3:1.1.0"

    // Android background work: periodic, battery-aware and Doze-compatible.
    // No foreground service and no background-location permission are used.
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Kotlin & Coroutines aligned with Capacitor 8 / Geolocation 8 metadata.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    // Capacitor runtime + generated Cordova compatibility module.
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Generated by `npx cap sync android`; required for @capacitor/geolocation,
// @capacitor/local-notifications and future official Capacitor plugins.
apply from: 'capacitor.build.gradle'
